[tool.poetry]
name = "htbam-db-api"
version = "1.1.0-alpha"
description = ""
authors = ["Nicholas-Freitas <nicholas.freitas@ucsf.edu>", "duncan-muir <muir.duncan@gmail.com>"]
readme = "README.md"

packages = [
  { include = "htbam_db_api", from = "src" }
]

include = [
  { path = "src/htbam_db_api/units/*.txt", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<3"
pandas = ">=2.1,<3"
pint = ">=0.24,<1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
